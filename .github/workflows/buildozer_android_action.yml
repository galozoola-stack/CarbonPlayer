name: Android Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Forces a manual "Run Workflow" button to appear in the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Used to cache dependencies with a timeout
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(date -u '+%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-global
          restore-keys: |
            ${{ runner.os }}-buildozer-global

      - name: Cache Buildozer directory in app
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-app
          restore-keys: |
            ${{ runner.os }}-buildozer-app

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer/android/platform/android-sdk
          key: ${{ runner.os }}-android-sdk
          restore-keys: |
            ${{ runner.os }}-android-sdk

      # Install Linux build system system-level dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ant \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            libunwind-dev \
            zlib1g-dev \
            autoconf-archive \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            openssl \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            libreadline-dev \
            uuid-dev \
            zip \
            unzip \
            autoconf \
            libtool \
            automake \
            libltdl-dev \
            m4 \
            pkg-config \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      # Set up Java 17 required by modern Gradle configurations
      - name: Setup Java 17 required by Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Set up Python Environment runtime layer
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install pip package configurations
      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel virtualenv
          pip install "Cython>=3.0,<4" "buildozer>=1.5.0"

      # Build with Buildozer (Automated License acceptance injected)
      - name: Build with Buildozer
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          yes | buildozer -v android debug

      # Upload completed Android APK binary artifacts out of cloud runners
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-Android-Package
          path: bin/*.apk
          
